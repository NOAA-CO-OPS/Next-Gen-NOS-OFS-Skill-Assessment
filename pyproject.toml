[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ofs-skill"
dynamic = ["version"]
description = "Next-Gen NOS OFS Skill Assessment and Processing Software"
authors = [
    {name = "NOAA CO-OPS", email = "co-ops.userservices@noaa.gov"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Public Domain"}
keywords = ["oceanography", "forecasting", "skill-assessment", "NOAA", "OFS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "xarray>=0.19.0",
    "dask>=2024.5.1",
    "netCDF4>=1.5.7",
    "h5netcdf>=1.0.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "scikit-learn>=0.24.0",
    "geopandas>=0.9.0",
    "shapely>=1.7.0",
    "requests>=2.26.0",
    "boto3>=1.34.0",
    "s3fs>=2021.0.0",
    # Pin floating Git deps to immutable commit SHAs (keep in sync with
    # environment.yml pip:). Human-readable release tags stay in comments.
    # searvey v0.4.2
    "searvey @ git+https://github.com/oceanmodeling/searvey.git@4c2afb8655dfc052f49855db1c9f30ad64b68522",
    "pyshp>=2.1.0",
    "intake>=0.6.4",
    "intake-xarray>=0.5.0",
    "intake-esm>=2021.8.17",
    "kaleido>=0.2.1",
    "seaborn>=0.11.0",
    "tkcalendar>=1.6.0",
    # coastalmodeling-vdatum v0.3.2
    "coastalmodeling-vdatum @ git+https://github.com/oceanmodeling/coastalmodeling-vdatum.git@0d63b2bbc0b0634e20a0ec55023a53354fab1b47",
    "cartopy>=0.23.0",
    "regionmask>=0.12.1",
    "global-land-mask>=1.0.0",
    "utide>=0.3.0",
]

[project.optional-dependencies]
spatial = [
    "pyinterp>=2024.11.0",
]
all = [
    "pyinterp>=2024.11.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=3.3.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "ruff==0.7.0",
    "mypy>=1.16.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.9.0",
    "detect-secrets>=1.5.0",
    "ipython>=7.26.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]
packaging = [
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
create-1dplot = "bin.visualization.create_1dplot:main"
create-2dplot = "bin.visualization.create_2dplot:main"
do-iceskill = "bin.skill_assessment.do_iceskill:main"
get-station-observations = "bin.obs_retrieval.get_station_observations_cli:main"
get-node-ofs = "bin.model_processing.get_node_cli:main"
ofs-skill-gui = "bin.visualization.gui_launcher:main"
run-harmonic-analysis = "bin.tidal_analysis.run_harmonic_analysis:main"
make-open-boundary-transect = "bin.open_boundary.make_open_boundary_transect:main"

[project.urls]
Homepage = "https://github.com/NOAA-CO-OPS/NOS_Shared_Cyberinfrastructure_and_Skill_Assessment"
Documentation = "https://github.com/NOAA-CO-OPS/NOS_Shared_Cyberinfrastructure_and_Skill_Assessment#readme"
Repository = "https://github.com/NOAA-CO-OPS/NOS_Shared_Cyberinfrastructure_and_Skill_Assessment.git"
"Bug Tracker" = "https://github.com/NOAA-CO-OPS/NOS_Shared_Cyberinfrastructure_and_Skill_Assessment/issues"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ofs_skill*", "bin*"]

[tool.setuptools.package-data]
"ofs_skill" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "ofs_skill.__version__"}

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "bin"]

# Match the codebase’s single-quote style so `ruff format` does not rewrite
# quotes to doubles (ruff’s default) and create large spurious diffs.
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Matplotlib / toolkit backends must be set before importing pyplot.
"**/plot_forecast_hours.py" = ["E402"]
"**/make_static_plots.py" = ["E402"]
"bin/**" = ["E402"]
# Import order is constrained by a circular dependency.
"src/ofs_skill/obs_retrieval/__init__.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
files = ["src/ofs_skill"]
ignore_missing_imports = true
warn_unused_ignores = false
show_error_codes = true
pretty = true

# Known typing debt left for follow-up PRs; the gate still covers the rest of the package.
[[tool.mypy.overrides]]
module = [
    "ofs_skill.visualization.processing_2d",
    "ofs_skill.visualization.plotting_2d",
    "ofs_skill.visualization.gui_helpers",
    "ofs_skill.skill_assessment.make_2d_skill_maps",
    "ofs_skill.model_processing.indexing",
]
ignore_errors = true

[tool.coverage.run]
source = ["src/ofs_skill"]
branch = false

[tool.coverage.report]
# Measured baseline 2026-08-10 (CI-equivalent markers): TOTAL 14378 stmts,
# 8658 missing ≈ 39.8% (term report shows 40%). Floor is 39 so the gate is
# not flaky on rounding. Ratchet UP as coverage improves; do not lower
# without maintainer approval.
fail_under = 39
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "--verbose --cov=src/ofs_skill --cov-report=html --cov-report=term-missing"
markers = [
    "network: marks tests as requiring network access (deselect with '-m \"not network\"')",
    "manual: marks tests as opt-in / live-API audits (run with '-m manual')",
    "integration: marks fixture-based pipeline integration tests (run in CI; no live network)",
]
