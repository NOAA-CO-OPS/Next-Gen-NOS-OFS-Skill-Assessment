# Build and deploy MkDocs to GitHub Pages from main.
#
# Requires: Settings → Pages → Source = GitHub Actions.
# Optional: disable this workflow if the org blocks Pages.

name: Docs pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/ofs_skill/**"
      - "README.md"
      - ".github/workflows/docs-pages.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs extras from pyproject
        run: |
          python -m pip install --upgrade pip
          # Install only the `[docs]` optional deps (mkdocs + mkdocstrings),
          # not the full scientific stack — API pages are built from `src/` via Griffe.
          python -c "import tomllib; from pathlib import Path; print('\n'.join(tomllib.loads(Path('pyproject.toml').read_text())['project']['optional-dependencies']['docs']))" > /tmp/docs-reqs.txt
          pip install -r /tmp/docs-reqs.txt

      - name: MkDocs build (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
